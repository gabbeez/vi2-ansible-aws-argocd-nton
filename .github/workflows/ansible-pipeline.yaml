name: Execute AWS Terraform and Ansible GitOps Loop
on:
  push:
    branches:
      - main

jobs:
  cloud-engineering-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Pull repository code onto cloud runner
        uses: actions/checkout@v4

      - name: Set up Terraform Toolset on Runner
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.0"

      - name: Initialize and Validate Terraform IaC
        run: |
          terraform init
          terraform validate

      - name: Set up Python Environment for Ansible
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Ansible Toolset via Pip
        run: |
          python -m pip install --upgrade pip
          pip install ansible

      - name: Run AWS Ansible Provisioning Blueprint
        run: ansible-playbook -i host.ini setup-aws-infrastructure.yaml

